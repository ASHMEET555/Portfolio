<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <rect width="1600" height="900" fill="#0B1220"/>

  <text x="64" y="64" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="800">Signal path - from schedule to action</text>
  <text x="64" y="98" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">How a detection becomes a case or a share block</text>

  <!-- horizontal pipeline -->
  <rect x="48" y="180" width="220" height="120" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2.5"/>
  <text x="158" y="235" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Scheduler</text>
  <text x="158" y="265" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" text-anchor="middle" font-weight="700">Runs checks</text>

  <path d="M278 240 H318" stroke="#64748B" stroke-width="3"/>
  <path d="M303 227 L323 240 L303 253" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="328" y="180" width="220" height="120" rx="16" fill="#111827" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="438" y="235" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Rule catalog</text>
  <text x="438" y="265" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" text-anchor="middle" font-weight="700">What to measure</text>

  <path d="M558 240 H598" stroke="#64748B" stroke-width="3"/>
  <path d="M583 227 L603 240 L583 253" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="608" y="180" width="220" height="120" rx="16" fill="#111827" stroke="#34D399" stroke-width="2.5"/>
  <text x="718" y="235" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Query engine</text>
  <text x="718" y="265" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" text-anchor="middle" font-weight="700">Scan live data</text>

  <path d="M838 240 H878" stroke="#64748B" stroke-width="3"/>
  <path d="M863 227 L883 240 L863 253" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="888" y="180" width="220" height="120" rx="16" fill="#111827" stroke="#FBBF24" stroke-width="2.5"/>
  <text x="998" y="235" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Normalize</text>
  <text x="998" y="265" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" text-anchor="middle" font-weight="700">Severity - evidence</text>

  <path d="M1118 240 H1158" stroke="#64748B" stroke-width="3"/>
  <path d="M1143 227 L1163 240 L1143 253" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1168" y="180" width="360" height="120" rx="16" fill="#111827" stroke="#FB7185" stroke-width="2.5"/>
  <text x="1348" y="235" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Anomaly record</text>
  <text x="1348" y="265" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" text-anchor="middle" font-weight="700">Durable risk signal</text>

  <!-- fork down -->
  <path d="M1348 300 V360" stroke="#64748B" stroke-width="3"/>
  <path d="M400 360 H1348" stroke="#64748B" stroke-width="3"/>
  <path d="M400 360 V420" stroke="#64748B" stroke-width="3"/>
  <path d="M1200 360 V420" stroke="#64748B" stroke-width="3"/>
  <path d="M387 405 L400 425 L413 405" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1187 405 L1200 425 L1213 405" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="80" y="440" width="640" height="320" rx="20" fill="#111827" stroke="#60A5FA" stroke-width="2.5"/>
  <text x="120" y="510" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="800">Investigation branch</text>
  <text x="120" y="570" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Critical signals open a case</text>
  <text x="120" y="610" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Analysts move open ? in progress ? resolved</text>
  <text x="120" y="650" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Every step is written to an audit trail</text>
  <text x="120" y="700" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">Ops closes the loop - not silent flags</text>

  <rect x="880" y="440" width="640" height="320" rx="20" fill="#111827" stroke="#F472B6" stroke-width="2.5"/>
  <text x="920" y="510" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="800">Partner-share branch</text>
  <text x="920" y="570" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Merchant, customer, and consumer views</text>
  <text x="920" y="610" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Gate stays closed while investigating</text>
  <text x="920" y="650" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Opens only after a terminal decision</text>
  <text x="920" y="700" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">Risky subjects stay out of share packs</text>
</svg>
