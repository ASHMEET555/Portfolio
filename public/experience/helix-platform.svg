<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <rect width="1600" height="900" fill="#0B1220"/>

  <text x="64" y="64" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="800">Helix - high-level platform</text>
  <text x="64" y="98" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">How commerce traffic reaches analytics, fraud, and partner share</text>

  <!-- Row 1 -->
  <rect x="80" y="180" width="280" height="150" rx="18" fill="#111827" stroke="#38BDF8" stroke-width="2.5"/>
  <text x="220" y="245" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="800" text-anchor="middle">PoS / Commerce</text>
  <text x="220" y="280" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" text-anchor="middle" font-weight="700">Live merchant traffic</text>

  <path d="M360 255 H430" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <path d="M415 242 L435 255 L415 268" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="440" y="180" width="300" height="150" rx="18" fill="#111827" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="590" y="245" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="800" text-anchor="middle">Helix Platform</text>
  <text x="590" y="280" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" text-anchor="middle" font-weight="700">Ingest - Query - Auth</text>

  <!-- split arrows to storage -->
  <path d="M740 230 H820" stroke="#64748B" stroke-width="3"/>
  <path d="M820 230 V200 H860" stroke="#64748B" stroke-width="3" fill="none"/>
  <path d="M845 188 L865 200 L845 212" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M820 230 V310 H860" stroke="#64748B" stroke-width="3" fill="none"/>
  <path d="M845 298 L865 310 L845 322" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="880" y="140" width="280" height="120" rx="18" fill="#111827" stroke="#34D399" stroke-width="2.5"/>
  <text x="1020" y="195" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Analytics Store</text>
  <text x="1020" y="228" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" text-anchor="middle" font-weight="700">Facts - trends - signals</text>

  <rect x="880" y="280" width="280" height="120" rx="18" fill="#111827" stroke="#FBBF24" stroke-width="2.5"/>
  <text x="1020" y="335" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Config Store</text>
  <text x="1020" y="368" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" text-anchor="middle" font-weight="700">Settings - ledgers</text>

  <!-- Row 2: three pillars fed from platform -->
  <path d="M590 330 V400" stroke="#64748B" stroke-width="3"/>
  <path d="M440 400 H740" stroke="#64748B" stroke-width="3"/>
  <path d="M440 400 V450" stroke="#64748B" stroke-width="3"/>
  <path d="M590 400 V450" stroke="#64748B" stroke-width="3"/>
  <path d="M740 400 V450" stroke="#64748B" stroke-width="3"/>
  <path d="M428 438 L440 455 L452 438" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M578 438 L590 455 L602 438" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M728 438 L740 455 L752 438" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- also connect analytics store down to fraud -->
  <path d="M1020 400 V520 H920" stroke="#64748B" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>
  <path d="M932 508 L915 520 L932 532" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="80" y="470" width="360" height="200" rx="18" fill="#111827" stroke="#F472B6" stroke-width="2.5"/>
  <text x="260" y="545" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="800" text-anchor="middle">Fraud Layer</text>
  <text x="260" y="585" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" text-anchor="middle" font-weight="700">Rules - ranking - realtime</text>
  <text x="260" y="615" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" text-anchor="middle" font-weight="700">Investigation lifecycle</text>

  <rect x="480" y="470" width="360" height="200" rx="18" fill="#111827" stroke="#60A5FA" stroke-width="2.5"/>
  <text x="660" y="545" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="800" text-anchor="middle">Ops Dashboard</text>
  <text x="660" y="585" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" text-anchor="middle" font-weight="700">Cases - scores - queues</text>
  <text x="660" y="615" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" text-anchor="middle" font-weight="700">Audit trail for analysts</text>

  <rect x="880" y="470" width="360" height="200" rx="18" fill="#111827" stroke="#FB7185" stroke-width="2.5"/>
  <text x="1060" y="545" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="800" text-anchor="middle">Partner-Share Gate</text>
  <text x="1060" y="585" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" text-anchor="middle" font-weight="700">Merchant - customer - consumer</text>
  <text x="1060" y="615" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" text-anchor="middle" font-weight="700">Hold share while flagged</text>

  <!-- horizontal flow fraud -> ops -> gate -->
  <path d="M440 570 H470" stroke="#64748B" stroke-width="2.5"/>
  <path d="M455 557 L475 570 L455 583" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M840 570 H870" stroke="#64748B" stroke-width="2.5"/>
  <path d="M855 557 L875 570 L855 583" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="80" y="760" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">PoS is the system of record - Helix adds analytics and risk intelligence</text>
  <text x="80" y="800" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">QueueBuster Helix - fraud track</text>

  <!-- right edge fill so no empty feel -->
  <rect x="1300" y="140" width="220" height="530" rx="18" fill="#111827" stroke="#475569" stroke-width="1.5" opacity="0.55"/>
  <text x="1410" y="280" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Outcomes</text>
  <text x="1410" y="340" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" text-anchor="middle" font-weight="700">Risk signals</text>
  <text x="1410" y="380" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" text-anchor="middle" font-weight="700">Open cases</text>
  <text x="1410" y="420" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" text-anchor="middle" font-weight="700">Safer shares</text>
  <text x="1410" y="460" fill="#FFFFFF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" text-anchor="middle" font-weight="700">Audit history</text>
</svg>
